# Ai_robotchat 前端 nginx 配置（独立实例，不影响 Xiaoyi 项目的 8080 nginx）
# 启动方式见 deploy/start-nginx.ps1
worker_processes  1;

error_log  logs/error.log  notice;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    client_max_body_size 20m;   # 图片上传走 Java 8081，前端只做静态托管；留余量

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen       8090;
        server_name  localhost;

        # 前端静态资源（npm run build 产物）
        root   D:/Ai_robotchat/frontend/dist;
        index  index.html;

        # SPA 路由回退：vue-router history 模式
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带哈希的构建产物：长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # index.html 禁缓存，保证发版即生效
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
