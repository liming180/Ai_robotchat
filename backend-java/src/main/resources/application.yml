spring:
  application:
    name: ai-companion
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_companion?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: your-super-secret-key-at-least-256-bits-long-for-hs256-algorithm
  expiration: 7200000
  refresh-expiration: 604800000

ai:
  service:
    url: http://localhost:5000

app:
  # 图片本地上传目录。相对路径按 Java 进程的工作目录解析，实际映射到绝对路径后由 /uploads/** 暴露。
  # 生产环境建议改为绝对路径或替换为对象存储。
  upload:
    dir: ./uploads
    base-url: http://localhost:8081
    max-size: 5242880  # 5MB
  email:
    # true 时验证码固定为 123456 且在接口响应中返回，仅用于本地联调。
    # 默认 false（代码里的 @Value 兜底），部署环境必须关闭。
    mock: true

server:
  # 本机 8080 被无关项目 xiaoyi-rag-server 长期占用，本项目固定 8081
  port: 8081
